name: Identity offline validation
# Public repository GitHub-hosted checks only: no deployment jobs, secrets,
# production services or external billing credentials.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identity-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed run 94
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 observed run 94
        with:
          node-version: '22.23.5'
      - run: npm --version && test "$(npm --version)" = 10.9.9
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git diff --exit-code -- package-lock.json
      - run: npm run test:offline
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- package-lock.json
  web:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed run 94
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 observed run 94
        with:
          node-version: '22.23.5'
      - run: npm --version && test "$(npm --version)" = 10.9.9
      - run: npm ci --no-audit --no-fund
      - run: git diff --exit-code -- package-lock.json
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- package-lock.json
  oauth-sdk:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed run 94
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 observed run 94
        with:
          node-version: '22.23.5'
      - name: Verify OAuth PKCE SDK offline regression suite
        run: node --experimental-strip-types --test sdk/test/oauth.test.mts
  flutter:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed run 94
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 observed run 94
        with:
          channel: stable
          flutter-version: '3.50.1'
      - run: flutter --version && dart --version
      - run: test "$(flutter --version --machine | jq -r .dartSdkVersion)" = 3.14.0
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: git diff --exit-code -- pubspec.lock
  postgres-recovery:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_PASSWORD: offline_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: offline_ci_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed run 94
        with:
          persist-credentials: false
      - name: Install PostgreSQL client if not available
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Test versioned recovery migration, legacy backfill, and replay
        run: bash scripts/qualify-recovery-postgres.sh
